map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# SPA 入口不缓存（避免旧 index.html 引用已不存在的构建产物导致白屏）；
# 带哈希的静态资源保持默认缓存行为。变量求值为空时该响应头不输出。
map $uri $spa_cache_control {
    default "";
    =/ "no-cache";
    =/index.html "no-cache";
}

server {
    listen 127.0.0.1:8081;
    server_name "";
    access_log off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Deployment runs this probe from inside the frontend container. It checks
    # backend/database/worker readiness without guessing or widening the
    # external MANAGEMENT_CIDRS allow-list for Docker Desktop gateway traffic.
    location = /backend-ready {
        proxy_pass http://backend:8000/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host backend;
    }

    location / {
        return 404;
    }
}

server {
    listen 8080 ssl default_server;
    listen [::]:8080 ssl default_server;
    server_name "";

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    return 444;
}

server {
    listen 8080 ssl;
    listen [::]:8080 ssl;
    server_name ${PUBLIC_HOSTNAME};

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 35m;
    root /usr/share/nginx/html;
    index index.html;

    # Production access is limited to the explicitly configured management
    # network. Docker's own loopback health probe is handled separately below.
    ${NGINX_MANAGEMENT_ALLOW_RULES}
    deny all;

    add_header Strict-Transport-Security "max-age=${HSTS_MAX_AGE}" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control $spa_cache_control always;

    location = /health/live {
        # The host-side deployment probe only needs a minimal process liveness
        # response plus the real TLS/SNI/HSTS boundary. Defining an access rule
        # here prevents inheriting the server-level deny list; all functional
        # routes, including /health/ready, remain management-address restricted.
        allow all;
        proxy_pass http://backend:8000/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health/ready {
        proxy_pass http://backend:8000/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Backend is reachable only on the internal Docker network. Overwrite,
        # rather than append, client-supplied forwarding headers before Uvicorn
        # trusts this proxy hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # SSE must reach the browser as events are committed, rather than waiting
    # for Nginx's response buffer to fill.
    location ~ ^/api/execution/v1/runs/[^/]+/events$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }

    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# SPA 入口不缓存（避免旧 index.html 引用已不存在的构建产物导致白屏）；
# 带哈希的静态资源保持默认缓存行为。变量求值为空时该响应头不输出。
map $uri $spa_cache_control {
    default "";
    =/ "no-cache";
    =/index.html "no-cache";
}

server {
    listen 127.0.0.1:8081;
    server_name "";
    access_log off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /backend-ready {
        proxy_pass http://backend:8000/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host backend;
    }

    location / {
        return 404;
    }
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 35m;
    root /usr/share/nginx/html;
    index index.html;

    ${NGINX_MANAGEMENT_ALLOW_RULES}
    deny all;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control $spa_cache_control always;

    location = /health/live {
        allow all;
        proxy_pass http://backend:8000/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/ready {
        proxy_pass http://backend:8000/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location ~ ^/api/execution/v1/runs/[^/]+/events$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }

    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

# docker-compose.yml
services:
  postgres:
    image: postgres:15-alpine
    container_name: textile-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - textile-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  area-infer:
    build:
      context: ./area-infer
      args:
        TORCH_VARIANT: ${AREA_INFER_TORCH_VARIANT:-cpu}
    container_name: textile-area-infer
    restart: unless-stopped
    environment:
      AREA_WEIGHTS_DIR: /opt/area_weights
      AREA_YOLACT_VENDOR_ROOT: /app/vendor/yolact
      AREA_INFER_DEVICE: ${AREA_INFER_DEVICE:-auto}
      AREA_INFER_GPU_POLICY: ${AREA_INFER_GPU_POLICY:-warn_continue}
    volumes:
      - type: bind
        source: "${AREA_MODEL_HOST_PATH:-./runtime/area-models}"
        target: /opt/area_weights
        read_only: true
    networks:
      - textile-net

  backend:
    build: ./backend
    container_name: textile-monitor-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      APP_ENV: "${APP_ENV:-production}"
      HEARTBEAT_TIMEOUT: 90
      HEARTBEAT_CHECK_INTERVAL: 10
      DATA_RETENTION_DAYS: 30
      STATUS_REPORT_RETENTION_HOURS: 48
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      WEB_TRANSPORT: "${WEB_TRANSPORT:-http}"
      PUBLIC_HOSTNAME: "${PUBLIC_HOSTNAME:-localhost}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost}"
      TLS_DIR_HOST_PATH: "${TLS_DIR_HOST_PATH:-}"
      TLS_MIN_VALID_DAYS: "${TLS_MIN_VALID_DAYS:-30}"
      HSTS_MAX_AGE: "${HSTS_MAX_AGE:-0}"
      MANAGEMENT_CIDRS: "${MANAGEMENT_CIDRS:-}"
      FORWARDED_ALLOW_IPS: "${FRONTEND_PROXY_IP:-172.30.0.10}"
      AREA_WEIGHTS_DIR: /opt/area_weights
      AREA_INFER_URL: http://area-infer:9001
      AREA_INFER_TIMEOUT_SEC: 60
      AREA_OUTPUT_DIR: /data/area_outputs
      AREA_EXCEL_TEMPLATE_PATH: /opt/area_templates/-面积法-定量试验原始记录-新系统.xls
      EXECUTION_ENABLED: ${EXECUTION_ENABLED:-true}
      EXECUTION_SESSION_SECRET: "${EXECUTION_SESSION_SECRET:?EXECUTION_SESSION_SECRET is required}"
      EXECUTION_CREDENTIAL_KEY: "${EXECUTION_CREDENTIAL_KEY:?EXECUTION_CREDENTIAL_KEY is required}"
      EXECUTION_COOKIE_SECURE: "${EXECUTION_COOKIE_SECURE:-false}"
      EXECUTION_BOOTSTRAP_ADMIN_USERNAME: ${EXECUTION_BOOTSTRAP_ADMIN_USERNAME:-}
      EXECUTION_BOOTSTRAP_ADMIN_PASSWORD: ${EXECUTION_BOOTSTRAP_ADMIN_PASSWORD:-}
      EXECUTION_SOURCE_ROOT: "${EXECUTION_SOURCE_ROOT:-/data/execution-source/10特纤/02-检验}"
      EXECUTION_RUNTIME_ROOT: /data/execution-runtime
      EXECUTION_PUBLISH_ROOT: /data/execution-publish
      EXECUTION_INDEX_INTERVAL_SECONDS: ${EXECUTION_INDEX_INTERVAL_SECONDS:-300}
      EXECUTION_AUTO_INDEX_ROOT_IDS: ${EXECUTION_AUTO_INDEX_ROOT_IDS:-regenerated_fiber_records}
      EXECUTION_WORKER_POLL_SECONDS: ${EXECUTION_WORKER_POLL_SECONDS:-1}
      EXECUTION_WORKER_LEASE_SECONDS: ${EXECUTION_WORKER_LEASE_SECONDS:-60}
      EXECUTION_NODE_MAX_ATTEMPTS: ${EXECUTION_NODE_MAX_ATTEMPTS:-5}
      EXECUTION_WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${EXECUTION_WORKER_HEARTBEAT_TIMEOUT_SECONDS:-45}
      EXECUTION_WORKER_SCHEMA_WAIT_SECONDS: ${EXECUTION_WORKER_SCHEMA_WAIT_SECONDS:-180}
      EXECUTION_OUTBOX_MAX_ATTEMPTS: ${EXECUTION_OUTBOX_MAX_ATTEMPTS:-10}
      EXECUTION_OUTBOX_RETENTION_DAYS: ${EXECUTION_OUTBOX_RETENTION_DAYS:-7}
      EXECUTION_SSE_MAX_SECONDS: ${EXECUTION_SSE_MAX_SECONDS:-300}
    volumes:
      - area_root_cifs:/data/share66
      - area_old_cifs:/data/share82
      - area_out_cifs:/data/share66_out
      - type: volume
        source: area_out_cifs
        target: /data/execution-source
        read_only: true
      - type: bind
        source: "${AREA_MODEL_HOST_PATH:-./runtime/area-models}"
        target: /opt/area_weights
        read_only: true
      - type: bind
        source: "${AREA_TEMPLATE_HOST_PATH:-./runtime/area-templates}"
        target: /opt/area_templates
        read_only: true
      - type: bind
        source: "${EXECUTION_RUNTIME_HOST_PATH:-./runtime/execution-runtime}"
        target: /data/execution-runtime
      - type: bind
        source: "${EXECUTION_PUBLISH_HOST_PATH:-./runtime/execution-publish}"
        target: /data/execution-publish
    depends_on:
      postgres:
        condition: service_healthy
      area-infer:
        condition: service_started
    networks:
      - textile-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  execution-worker:
    build: ./backend
    container_name: textile-execution-worker
    restart: unless-stopped
    command: ["python", "-m", "app.execution.worker"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      APP_ENV: "${APP_ENV:-production}"
      WEB_TRANSPORT: "${WEB_TRANSPORT:-http}"
      PUBLIC_HOSTNAME: "${PUBLIC_HOSTNAME:-localhost}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost}"
      TLS_DIR_HOST_PATH: "${TLS_DIR_HOST_PATH:-}"
      TLS_MIN_VALID_DAYS: "${TLS_MIN_VALID_DAYS:-30}"
      HSTS_MAX_AGE: "${HSTS_MAX_AGE:-0}"
      MANAGEMENT_CIDRS: "${MANAGEMENT_CIDRS:-}"
      EXECUTION_ENABLED: ${EXECUTION_ENABLED:-true}
      EXECUTION_SESSION_SECRET: "${EXECUTION_SESSION_SECRET:?EXECUTION_SESSION_SECRET is required}"
      EXECUTION_CREDENTIAL_KEY: "${EXECUTION_CREDENTIAL_KEY:?EXECUTION_CREDENTIAL_KEY is required}"
      EXECUTION_COOKIE_SECURE: "${EXECUTION_COOKIE_SECURE:-false}"
      EXECUTION_SOURCE_ROOT: "${EXECUTION_SOURCE_ROOT:-/data/execution-source/10特纤/02-检验}"
      EXECUTION_RUNTIME_ROOT: /data/execution-runtime
      EXECUTION_PUBLISH_ROOT: /data/execution-publish
      EXECUTION_INDEX_INTERVAL_SECONDS: ${EXECUTION_INDEX_INTERVAL_SECONDS:-300}
      EXECUTION_AUTO_INDEX_ROOT_IDS: ${EXECUTION_AUTO_INDEX_ROOT_IDS:-regenerated_fiber_records}
      EXECUTION_WORKER_POLL_SECONDS: ${EXECUTION_WORKER_POLL_SECONDS:-1}
      EXECUTION_WORKER_LEASE_SECONDS: ${EXECUTION_WORKER_LEASE_SECONDS:-60}
      EXECUTION_NODE_MAX_ATTEMPTS: ${EXECUTION_NODE_MAX_ATTEMPTS:-5}
      EXECUTION_WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${EXECUTION_WORKER_HEARTBEAT_TIMEOUT_SECONDS:-45}
      EXECUTION_WORKER_SCHEMA_WAIT_SECONDS: ${EXECUTION_WORKER_SCHEMA_WAIT_SECONDS:-180}
      EXECUTION_OUTBOX_MAX_ATTEMPTS: ${EXECUTION_OUTBOX_MAX_ATTEMPTS:-10}
      EXECUTION_OUTBOX_RETENTION_DAYS: ${EXECUTION_OUTBOX_RETENTION_DAYS:-7}
      EXECUTION_SSE_MAX_SECONDS: ${EXECUTION_SSE_MAX_SECONDS:-300}
    volumes:
      - type: volume
        source: area_out_cifs
        target: /data/execution-source
        read_only: true
      - type: bind
        source: "${EXECUTION_RUNTIME_HOST_PATH:-./runtime/execution-runtime}"
        target: /data/execution-runtime
      - type: bind
        source: "${EXECUTION_PUBLISH_HOST_PATH:-./runtime/execution-publish}"
        target: /data/execution-publish
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - textile-net
    healthcheck:
      test: ["CMD", "python", "-m", "app.execution.worker_health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: textile-monitor-frontend
    restart: unless-stopped
    environment:
      WEB_TRANSPORT: "${WEB_TRANSPORT:-http}"
      PUBLIC_HOSTNAME: "${PUBLIC_HOSTNAME:-localhost}"
      HSTS_MAX_AGE: "${HSTS_MAX_AGE:-0}"
      MANAGEMENT_CIDRS: "${MANAGEMENT_CIDRS:-}"
      NGINX_ENVSUBST_FILTER: "^PUBLIC_HOSTNAME$|^HSTS_MAX_AGE$|^NGINX_MANAGEMENT_ALLOW_RULES$"
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_HTTP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      textile-net:
        ipv4_address: "${FRONTEND_PROXY_IP:-172.30.0.10}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://127.0.0.1:8081/healthz",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:

  area_root_cifs:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER_A:?SMB_USER_A is required},password=${SMB_PASS_A:?SMB_PASS_A is required},vers=3.0,iocharset=utf8,noperm,uid=0,gid=0,file_mode=0777,dir_mode=0777"
      device: "//192.168.105.66/17检验八部"

  area_out_cifs:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER_B:?SMB_USER_B is required},password=${SMB_PASS_B:?SMB_PASS_B is required},vers=3.0,iocharset=utf8,noperm,uid=0,gid=0,file_mode=0777,dir_mode=0777"
      device: "//192.168.105.82/材料检测中心"

  area_old_cifs:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER_A:?SMB_USER_A is required},password=${SMB_PASS_A:?SMB_PASS_A is required},vers=3.0,iocharset=utf8,noperm,uid=0,gid=0,file_mode=0777,dir_mode=0777"
      device: "//192.168.105.66/17检验八部"

networks:
  textile-net:
    driver: bridge
    ipam:
      config:
        - subnet: "${DOCKER_SUBNET:-172.30.0.0/24}"
